# =====================================================================
#  Airway aerosol delivery study — master configuration
# =====================================================================
#  Every important numerical / physical choice lives here, not inside
#  scripts.  Each entry is tagged:
#     [DERIVED]     computed or justified (see docs/MODEL_DECISIONS.md)
#     [PROVISIONAL] reasonable starting value that must be checked by the
#                   validation studies in validation/
#     [CHOICE]      a study-design decision you can change freely
#  Units: SI unless the key name says otherwise (e.g. *_mm, *_um).
# =====================================================================

project:
  name: airway-aerosol-delivery
  geometry_zip: input/Onshape_Airway_Week1_Package.zip

# ---------------------------------------------------------------------
#  OpenFOAM execution
# ---------------------------------------------------------------------
openfoam:
  runner: docker                    # [CHOICE] docker | native
  docker_image: opencfd/openfoam-default:2406
  bashrc: /usr/lib/openfoam/openfoam2406/etc/bashrc   # used inside docker
  n_procs: 8                        # [CHOICE] MPI ranks for the airflow solver
  write_format: binary              # [CHOICE] binary keeps the 9 transient airflow cases small

# ---------------------------------------------------------------------
#  Geometry (values from QA_report.json / README.txt in the ZIP)
# ---------------------------------------------------------------------
geometry:
  version: v002                    # [CHOICE] v001 = approved Onshape STL (junction defects, see docs/GEOMETRY_QA.md)
                                   #          v002 = corrected smooth junction (scripts/build_geometry_v002.py)
  stl_units: mm
  scale_to_m: 0.001
  variants:
    healthy: {source_stem: Healthy_Airway_APPROVED_v001, narrowing_percent: 0,  label: "Healthy (0%)",      short: HLT}
    n20:     {source_stem: Airway_N20_APPROVED_v001,     narrowing_percent: 20, label: "20% narrowing",     short: N20}
    n40:     {source_stem: Airway_N40_APPROVED_v001,     narrowing_percent: 40, label: "40% narrowing",     short: N40}
  comparison_step: Airway_0_20_40_Comparison.step
  parent_diameter_mm: 8.0
  parent_length_mm: 40.0
  daughter_diameter_mm: 6.0
  daughter_length_mm: 60.0
  branch_angle_deg: 30.0
  bifurcation_point_mm: [0.0, 0.0, 40.0]
  target_outlet_center_mm: [30.0, 0.0, 91.961524]      # right / +X branch
  comparison_outlet_center_mm: [-30.0, 0.0, 91.961524] # left  / -X branch
  inlet_center_mm: [0.0, 0.0, 0.0]
  # constriction position measured along the TARGET branch centre-line,
  # starting at the bifurcation point (verified from the STL by
  # scripts/identify_boundaries.py -> docs/boundary_identification.md)
  narrowing_start_mm: 14.0
  narrowing_end_mm: 26.0
  # Boundary identification tolerances
  cap_plane_tol_mm: 0.02           # triangle must lie within this distance of the cap plane
  cap_normal_tol: 0.999            # |cos(angle)| between triangle normal and cap normal

# ---------------------------------------------------------------------
#  Regions used for deposition accounting  [CHOICE]
#  s = distance (mm) along the branch centre-line from the bifurcation
# ---------------------------------------------------------------------
regions:
  # Target entry plane: perpendicular to the target branch axis, a fixed
  # distance past the END of the narrowing.  The same plane position is
  # used for the healthy geometry so that all three geometries are
  # measured at the same place.
  target_plane_s_mm: 28.0          # [CHOICE] 2 mm past narrowing end (26 mm)
  target_plane_radius_mm: 3.3      # [CHOICE] slightly > branch radius (3 mm) so the whole lumen is covered
  # upstream     = parent tube + junction + target branch s < narrowing_start
  # constriction = target branch narrowing_start <= s < target_plane_s
  # target       = target branch s >= target_plane_s
  # comparison   = whole comparison (-X) branch

# ---------------------------------------------------------------------
#  Air properties  [DERIVED] air at ~37 C body temperature is often used;
#  we use 20-25 C room air values because the bench geometry is a model.
#  Change if you want body-temperature air.
# ---------------------------------------------------------------------
air:
  density: 1.2                     # kg/m3
  kinematic_viscosity: 1.5e-5      # m2/s
  dynamic_viscosity: 1.8e-5        # Pa s
  mean_free_path: 0.068e-6         # m (Cunningham slip)
  temperature_K: 293.15

# ---------------------------------------------------------------------
#  Breathing
# ---------------------------------------------------------------------
breathing:
  inhalation_duration_s: 2.0
  mean_flow_L_per_min: 2.0         # mean local flow in the parent airway
  post_inhalation_s: 1.0           # zero imposed inlet flow afterwards (settling)
  waveform_points: 401             # samples over the inhalation
  waveforms:                       # normalised Beta(a,b) shapes on [0, T]
    early:     {a: 2, b: 5, label: "Early-peaking Beta(2,5)", short: EAR}
    symmetric: {a: 3, b: 3, label: "Symmetric Beta(3,3)",     short: SYM}
    late:      {a: 5, b: 2, label: "Late-peaking Beta(5,2)",  short: LAT}
  constant_flow_case:              # Phase-4 smoke test
    flow_L_per_min: 2.0
    end_time_s: 0.4                # ~3 parent flow-through times

# ---------------------------------------------------------------------
#  Airflow CFD settings
# ---------------------------------------------------------------------
airflow:
  solver: pimpleFoam               # [DERIVED] transient incompressible
  flow_model: laminar              # [DERIVED] Re_peak < ~1000 (docs/MODEL_DECISIONS.md)
  inlet_profile: parabolic         # [PROVISIONAL] parabolic | plug
  outlet_bc: equalPressure         # [PROVISIONAL] both outlets p = 0 (validation #9 tests alternatives)
  max_courant: 3.0                 # [PROVISIONAL] adaptive time step limit; PIMPLE outer iterations keep
                                   # Co>1 stable. Flow is near quasi-steady (Womersley ~1.3).
                                   # Checked by validation/05_timestep_independence (Co 0.5/1/3/5)
  initial_dt: 1.0e-5
  max_dt: 2.0e-3
  write_interval_s: 0.02           # [PROVISIONAL] airflow snapshots reused by particle cases
  n_outer_correctors: 2            # [PROVISIONAL] needed for Co > 1
  n_correctors: 1
  n_non_orth_correctors: 1

# ---------------------------------------------------------------------
#  Mesh (snappyHexMesh)   [PROVISIONAL]  -> validation/04_mesh_independence
# ---------------------------------------------------------------------
mesh:
  level: coarse                    # [PROVISIONAL] level used by the study cases. Set to the level that
                                   # validation/04_mesh_independence shows is converged.
                                   # 'coarse' is the development mesh used for the runs executed so far
                                   # (cost on this Mac/Docker: ~6 us per cell per step).
  levels:
    coarse: {background_cell_mm: 0.8, surface_level: [1, 1], refine_inside_level: 0, boundary_layers: 0}
    medium: {background_cell_mm: 0.6, surface_level: [1, 2], refine_inside_level: 0, boundary_layers: 3}
    fine:   {background_cell_mm: 0.45, surface_level: [1, 2], refine_inside_level: 0, boundary_layers: 4}
  location_in_mesh_mm: [0.13, 0.17, 20.11]  # point inside the parent tube (not on a cell face)
  feature_angle_deg: 30
  checkmesh_limits:                # automation STOPS the case if violated
    max_non_orthogonality: 70
    max_skewness: 4.0
    min_volume: 0.0                # any negative/zero volume fails
    allow_failed_checks: false

# ---------------------------------------------------------------------
#  Particles
# ---------------------------------------------------------------------
particles:
  coupling: one-way                # [CHOICE] airflow -> particles only
  density: 1000.0                  # kg/m3
  diameters_um: [1, 2, 3, 5]
  introduced_mass_kg: 1.0e-9       # [CHOICE] same for EVERY case (results are % of this)
  parcels_per_case: 20000          # [PROVISIONAL] -> validation/06_parcel_convergence
  random_seed: 1                   # [CHOICE] -> validation/07_random_seeds
  gravity: [0.0, 0.0, 9.81]        # [PROVISIONAL] upright subject: inhaled air travels DOWN
                                   # the trachea, i.e. along +Z of this model
  forces: [drag, gravity]          # sphereDrag + gravity
  cunningham_slip: true            # [DERIVED] +17% relaxation time at 1 um -> applied (docs/MODEL_DECISIONS.md)
  brownian: false                  # [DERIVED] negligible vs. convection at these scales (docs)
  wall_interaction: stick          # [CHOICE] initial model
  initial_velocity: local_air      # mean inlet air velocity at the release time (relaxes in < 0.1 ms)
  release_rate_mode: flow_proportional   # [CHOICE] mass release rate ∝ inlet flow inside the window
  tracking_dt_s: 1.0e-3            # [PROVISIONAL] cloud time step (validation #5)
  release_strategies:              # windows in fraction F of inspired volume
    continuous: {F: [0.00, 1.00], short: CONT}
    early:      {F: [0.10, 0.20], short: EARLY}
    middle:     {F: [0.30, 0.40], short: MID}
    late:       {F: [0.50, 0.60], short: LATE}

# ---------------------------------------------------------------------
#  QA thresholds
# ---------------------------------------------------------------------
qa:
  airflow_mass_imbalance_percent: 0.5     # |Q_in - Q_out| / Q_in (time-averaged, inhalation)
  particle_mass_balance_percent: 1.0      # |introduced - (dep + esc + susp)| / introduced
  backward_crossing_warn_percent: 0.5     # mass re-crossing the target plane upstream
